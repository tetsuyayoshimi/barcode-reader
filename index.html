<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>バーコード記録</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f3f4f6; color:#111827; }
    .wrap { max-width:760px; margin:0 auto; padding:14px; }
    h1 { font-size:22px; margin:4px 0 12px; }
    .card { background:white; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
    #reader { width:100%; min-height:300px; background:#111; border-radius:12px; overflow:hidden; }
    .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    button { border:0; border-radius:10px; padding:12px 16px; font-size:16px; background:#111827; color:white; }
    button.secondary { background:#4b5563; }
    button.danger { background:#b91c1c; }
    button:disabled { opacity:.5; }
    input { width:100%; font-size:18px; padding:12px; border-radius:10px; border:1px solid #d1d5db; margin-top:8px; }
    .status { padding:10px 12px; border-radius:10px; margin-top:10px; background:#eef2ff; font-size:14px; line-height:1.5; }
    .muted { color:#6b7280; font-size:12px; line-height:1.5; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { padding:9px 6px; border-bottom:1px solid #e5e7eb; text-align:left; }
    .count { font-weight:700; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>バーコード記録</h1>

  <div class="card">
    <div id="reader"></div>
    <div id="status" class="status">カメラを起動しています…</div>
    <div class="row">
      <button id="startBtn">カメラ開始</button>
      <button id="stopBtn" class="secondary" disabled>停止</button>
    </div>
    <p class="muted">Android Chrome推奨。初回はカメラの使用許可が必要です。HTTPSで開いてください。</p>
  </div>

  <div class="card">
    <strong>手入力</strong>
    <input id="manualInput" placeholder="バーコード番号" inputmode="numeric">
    <div class="row"><button id="manualAddBtn">記録する</button></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; align-items:center; margin-top:0">
      <div><strong>記録一覧</strong> <span id="count" class="count"></span></div>
      <div class="row" style="margin-top:0">
        <button id="csvBtn" class="secondary">CSV出力</button>
        <button id="clearBtn" class="danger">全削除</button>
      </div>
    </div>
    <div style="overflow:auto; margin-top:8px">
      <table>
        <thead><tr><th>バーコード番号</th><th>読取日</th><th>読取時刻</th></tr></thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "barcode_logger_android_v1";
let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let scanner = null;
let running = false;
let lastCode = "";
let lastScanAt = 0;

const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const manualInput = document.getElementById("manualInput");
const manualAddBtn = document.getElementById("manualAddBtn");
const logBody = document.getElementById("logBody");
const countEl = document.getElementById("count");

function nowParts() {
  const d = new Date();
  return {
    date: d.toLocaleDateString("ja-JP"),
    time: d.toLocaleTimeString("ja-JP", {hour12:false})
  };
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  render();
}

function addRecord(code) {
  const value = String(code || "").trim();
  if (!value) return;
  const n = nowParts();
  records.unshift({code:value, date:n.date, time:n.time, ts:Date.now()});
  save();
  statusEl.textContent = "記録しました: " + value;
  if (navigator.vibrate) navigator.vibrate([80,40,80]);
}

function render() {
  logBody.innerHTML = "";
  countEl.textContent = `（${records.length}件）`;
  records.forEach(r => {
    const tr = document.createElement("tr");
    [r.code, r.date, r.time].forEach(v => {
      const td = document.createElement("td");
      td.textContent = v;
      tr.appendChild(td);
    });
    logBody.appendChild(tr);
  });
}

function onScanSuccess(decodedText) {
  const now = Date.now();
  if (decodedText && (decodedText !== lastCode || now - lastScanAt > 3000)) {
    lastCode = decodedText;
    lastScanAt = now;
    addRecord(decodedText);
  }
}

function onScanFailure() {
  // 認識できないフレームは無視
}

async function startScanner() {
  if (running) return;

  if (!window.isSecureContext) {
    statusEl.textContent = "カメラ利用にはHTTPSで開く必要があります。";
    return;
  }

  try {
    if (!scanner) scanner = new Html5Qrcode("reader");

    statusEl.textContent = "背面カメラを起動しています…";

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 12,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const width = Math.floor(viewfinderWidth * 0.9);
          const height = Math.floor(Math.min(viewfinderHeight * 0.45, 220));
          return { width, height };
        },
        aspectRatio: 1.777778,
        disableFlip: true
      },
      onScanSuccess,
      onScanFailure
    );

    running = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    statusEl.textContent = "バーコードを枠内に映してください。";
  } catch (e) {
    running = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    statusEl.textContent = "カメラを起動できませんでした。Chromeのサイト設定でカメラを「許可」にしてください。";
    console.error(e);
  }
}

async function stopScanner() {
  if (!scanner || !running) return;
  try {
    await scanner.stop();
    await scanner.clear();
  } catch(e) {}
  scanner = null;
  running = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  statusEl.textContent = "カメラを停止しました。";
}

startBtn.addEventListener("click", startScanner);
stopBtn.addEventListener("click", stopScanner);

manualAddBtn.addEventListener("click", () => {
  addRecord(manualInput.value);
  manualInput.value = "";
  manualInput.focus();
});
manualInput.addEventListener("keydown", e => {
  if (e.key === "Enter") manualAddBtn.click();
});

document.getElementById("csvBtn").addEventListener("click", () => {
  const rows = [["バーコード番号","読取日","読取時刻"]];
  [...records].reverse().forEach(r => rows.push([r.code,r.date,r.time]));
  const csv = "\uFEFF" + rows.map(row => row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(",")).join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "barcode_log_" + new Date().toISOString().slice(0,10) + ".csv";
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("記録をすべて削除しますか？")) return;
  records = [];
  save();
});

// ページ表示後すぐに背面カメラを起動。
// Android Chromeでは初回のみ権限確認が表示される。
window.addEventListener("load", () => {
  render();
  setTimeout(startScanner, 250);
});

// タブ復帰時、停止していれば再起動を試す
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !running) {
    setTimeout(startScanner, 300);
  }
});
</script>
</body>
</html>
