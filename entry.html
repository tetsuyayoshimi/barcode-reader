<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>入場者を読み取る</title>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:28px;margin:8px 0 16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:15px 18px;font-size:18px;background:#111827;color:#fff}
button.secondary{background:#4b5563}
input{width:100%;font-size:18px;padding:12px;border:1px solid #d1d5db;border-radius:10px}
#reader{width:100%;overflow:hidden;border-radius:14px;background:#111}
.status{padding:12px;border-radius:10px;margin-top:10px;background:#eef2ff}
.status.ok{background:#ecfdf5;font-weight:700}
.status.warn{background:#fff7ed}
#result{padding:12px;text-align:center}
.big{font-size:28px;font-weight:800}
.code{font-size:30px;font-weight:800;letter-spacing:1px;margin:10px 0;word-break:break-all}
.count{font-size:24px;font-weight:800}
.sync{font-size:14px;color:#6b7280;margin-top:8px}
.note{font-size:14px;color:#6b7280;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>入場者を読み取る</h1>

  <div class="card">
    <label>端末名</label>
    <input id="deviceName" placeholder="例：受付A / 東口1">
  </div>

  <div class="card">
    <div class="row">
      <button id="binaryEyeBtn" style="display:none">Binary Eyeを起動</button>
      <button id="cameraBtn" class="secondary">カメラ読取開始</button>
    </div>
    <p id="platformGuide" class="note"></p>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div id="status" class="status">準備中です。</div>
  </div>

  <div class="card">
    <div id="result">
      <div class="note">バーコードを読み取ると自動登録され、確認音が鳴ります。</div>
    </div>
  </div>
</div>

<script>

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwL35IXVPzxx73F0eUQbV2RAqMwIQWJd-CEPiYf4QPpI3mbPlQPXPTsQSYdfP1grIH7/exec";
const GATE_TYPE = "入場";
const DEVICE_KEY = "event_gate_device_name_v3";
const QUEUE_KEY = "event_gate_queue_v3";
const LAST_SCAN_KEY = "event_gate_last_scan_v3";

let html5QrCode = null;
let running = false;
let currentVisibleCode = null;
let lastAcceptedCode = null;
let lastAcceptedAt = 0;
let codeAbsentSince = 0;

const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const deviceEl = document.getElementById("deviceName");
const readerEl = document.getElementById("reader");

function uuidv4() {
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function nowParts() {
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  return {
    date: `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`,
    time: `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`,
    iso: d.toISOString()
  };
}

function getDeviceName() {
  return localStorage.getItem(DEVICE_KEY) || "";
}
function saveDeviceName() {
  localStorage.setItem(DEVICE_KEY, deviceEl.value.trim());
}
deviceEl.value = getDeviceName();
deviceEl.addEventListener("change", saveDeviceName);
deviceEl.addEventListener("blur", saveDeviceName);

function getQueue() {
  try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); }
  catch(e) { return []; }
}
function saveQueue(q) {
  localStorage.setItem(QUEUE_KEY, JSON.stringify(q));
}
function enqueue(rec) {
  const q = getQueue();
  q.push(rec);
  saveQueue(q);
}
function removeQueuedId(id) {
  saveQueue(getQueue().filter(x => x.id !== id));
}

function beepOk() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 1200;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.12);
  } catch(e) {}
}

function setStatus(msg, cls="") {
  statusEl.className = "status " + cls;
  statusEl.textContent = msg;
}

function showResult(code, count, synced=true) {
  resultEl.innerHTML = `
    <div class="big">${GATE_TYPE} 登録完了</div>
    <div class="code">${code}</div>
    <div class="count">${count ? `${GATE_TYPE} ${count}回目` : `${GATE_TYPE} 登録`}</div>
    <div class="sync">${synced ? "スプレッドシート送信済み" : "通信待ち・端末に保存済み"}</div>
  `;
}

function normalizeCode(raw) {
  const value = String(raw ?? "").trim();

  // Binary Eyeの戻り値プレースホルダーがそのまま返った場合は無効扱い。
  if (!value) return "";
  if (value === "{RESULT}" || value === "{FORMAT}") return "";
  if (/^\{[A-Z_]+\}$/.test(value)) return "";

  return value;
}

// 同一バーコードの「かざしっぱなし」による連続検出だけを抑止。
// 一度別のバーコードが見えた、または一定時間コードが見えない状態になった後は再受付可能。
function shouldAcceptScan(code) {
  const now = Date.now();

  if (!code) return false;

  if (lastAcceptedCode !== code) return true;

  // 前回受付後、画面から外れた時間が0.8秒以上あれば再受付可
  if (codeAbsentSince && now - codeAbsentSince >= 800) return true;

  // 安全弁として、同一コードの超短時間連打は拒否
  if (now - lastAcceptedAt < 2500) return false;

  // 「画面から外れた」判定が取れない端末向けに、8秒以上なら再受付可
  return now - lastAcceptedAt >= 8000;
}

function rememberAccepted(code) {
  lastAcceptedCode = code;
  lastAcceptedAt = Date.now();
  codeAbsentSince = 0;
  localStorage.setItem(LAST_SCAN_KEY, JSON.stringify({
    code, gateType:GATE_TYPE, at:lastAcceptedAt
  }));
}

async function sendRecord(rec) {
  const payload = {
    records: [{
      id: String(rec.id || ""),
      code: String(rec.code || ""),
      gateType: String(rec.gateType || ""),
      deviceName: String(rec.deviceName || ""),
      date: String(rec.date || ""),
      time: String(rec.time || ""),
      iso: String(rec.iso || "")
    }]
  };

  const res = await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  });

  // no-cors ではレスポンス本文を読めないため、
  // 通信要求がブラウザから送出できた時点で成功扱いにする。
  return { ok: true, count: "" };
}

async function processScan(raw) {
  const rawValue = String(raw ?? "").trim();
  const code = normalizeCode(raw);

  if (!code) {
    if (rawValue) {
      setStatus("無効な読み取り結果を検出しました。登録していません。", "warn");
    }
    return;
  }

  if (!shouldAcceptScan(code)) {
    setStatus("同じバーコードの連続検出を無視しました。", "warn");
    return;
  }

  rememberAccepted(code);
  beepOk();

  const p = nowParts();
  const rec = {
    id: uuidv4(),
    code: code, // 必ず文字列
    gateType: GATE_TYPE,
    deviceName: getDeviceName(),
    date: p.date,
    time: p.time,
    iso: p.iso
  };

  // 通信失敗に備え、送信前に端末へ保存
  enqueue(rec);

  setStatus(`${code} を読み取りました。送信中…`, "ok");

  try {
    const res = await sendRecord(rec);
    removeQueuedId(rec.id);
    showResult(code, "", true);
    setStatus("登録しました。次のバーコードを読み取れます。", "ok");
  } catch(e) {
    showResult(code, "—", false);
    setStatus("通信できなかったため端末に保存しました。自動再送します。", "warn");
  }
}

async function retryQueue() {
  const q = getQueue();
  if (!q.length) return;
  for (const rec of q.slice()) {
    try {
      await sendRecord(rec);
      removeQueuedId(rec.id);
    } catch(e) {}
  }
}
setInterval(retryQueue, 60 * 1000);
window.addEventListener("online", retryQueue);
window.addEventListener("load", retryQueue);

function isIOSDevice() {
  const ua = navigator.userAgent || "";
  return /iPad|iPhone|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function isAndroidDevice() {
  return /Android/i.test(navigator.userAgent || "");
}

async function startScanner() {
  if (running) return;
  html5QrCode = new Html5Qrcode("reader");
  try {
    let cameraConfig = { facingMode: "environment" };
    if (!isIOSDevice()) {
      try {
        const cameras = await Html5Qrcode.getCameras();
        const rear = cameras.find(c => /back|rear|environment|背面/i.test(c.label || ""));
        if (rear) cameraConfig = { deviceId: { exact: rear.id } };
      } catch(e) {}
    }

    const config = {
      fps: isIOSDevice() ? 12 : 18,
      qrbox: (viewfinderWidth, viewfinderHeight) => {
        const width = Math.floor(viewfinderWidth * 0.90);
        const height = Math.max(90, Math.floor(viewfinderHeight * 0.30));
        return { width, height };
      },
      aspectRatio: 1.777778,
      disableFlip: false,
      rememberLastUsedCamera: true
    };

    await html5QrCode.start(
      cameraConfig,
      config,
      decodedText => {
        currentVisibleCode = normalizeCode(decodedText);
        codeAbsentSince = 0;
        processScan(decodedText);
      },
      () => {
        // デコード失敗が続く＝コードが画面から外れた可能性
        if (currentVisibleCode) {
          currentVisibleCode = null;
          codeAbsentSince = Date.now();
        }
      }
    );
    running = true;
    setStatus("カメラ起動中。バーコードを枠に合わせてください。");
  } catch(e) {
    setStatus("カメラを起動できませんでした。カメラ許可を確認してください。", "warn");
  }
}

async function stopScanner() {
  if (!running || !html5QrCode) return;
  try { await html5QrCode.stop(); } catch(e) {}
  running = false;
}

function makeBinaryEyeReturnUrl() {
  const u = new URL(location.href);
  u.searchParams.delete("be_result");
  u.searchParams.delete("be_format");
  u.searchParams.set("be_result", "{RESULT}");
  u.searchParams.set("be_format", "{FORMAT}");
  return u.toString();
}

function openBinaryEye() {
  const ret = encodeURIComponent(makeBinaryEyeReturnUrl());
  location.href = `binaryeye://scan?ret=${ret}`;
}

function handleBinaryEyeReturn() {
  const u = new URL(location.href);
  const r = u.searchParams.get("be_result");

  if (r === null) return false;

  u.searchParams.delete("be_result");
  u.searchParams.delete("be_format");
  history.replaceState({}, "", u.toString());

  const code = normalizeCode(r);

  // {RESULT} 等がそのまま返ってきた場合は絶対に登録しない。
  if (!code) {
    setStatus("Binary Eyeから有効なバーコード値を受け取れませんでした。登録していません。", "warn");
    return true;
  }

  processScan(code);
  return true;
}

function configureUI() {
  const beBtn = document.getElementById("binaryEyeBtn");
  const camBtn = document.getElementById("cameraBtn");
  const guide = document.getElementById("platformGuide");

  if (isAndroidDevice()) {
    beBtn.style.display = "inline-block";
    camBtn.style.display = "inline-block";
    guide.textContent = "Android：Binary Eye推奨。ブラウザカメラも使用できます。";
  } else {
    beBtn.style.display = "none";
    camBtn.style.display = "inline-block";
    guide.textContent = isIOSDevice()
      ? "iPad / iPhone：SafariまたはChromeのカメラで読み取ります。"
      : "この端末ではブラウザカメラで読み取ります。";
  }
}

document.getElementById("binaryEyeBtn").addEventListener("click", openBinaryEye);
document.getElementById("cameraBtn").addEventListener("click", startScanner);

window.addEventListener("load", () => {
  configureUI();
  const returned = handleBinaryEyeReturn();
  if (!returned && !isIOSDevice()) {
    setTimeout(startScanner, 300);
  } else if (isIOSDevice()) {
    setStatus("「カメラ読取開始」を押してください。");
  }
});

</script>
</body>
</html>
